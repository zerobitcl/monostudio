<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Encuesta de funcionamiento del tribunal</title>
  <link rel="stylesheet" href="encuesta.css?v=20261126c">
</head>
<body>
  <header class="mast">
    <img class="mast__logo" src="img/poder-judicial.png?v=20261126c" width="737" height="343" alt="Poder Judicial. República de Chile.">
    <img class="mast__photo" src="img/tribunal.jpg?v=20261126c" width="1024" height="682" alt="Fachada blanca del Tribunal de Juicio Oral en lo Penal y Juzgado de Garantía, con el nombre del tribunal en el muro y cielo despejado.">
  </header>
  <main class="sheet">
    <p class="kicker">Funcionamiento del tribunal</p>
    <h1>Registra aquí tus inquietudes, necesidades y sugerencias para tu cargo, para un mejor funcionamiento del tribunal y para un mejor servicio a usuarios</h1>
    <p class="lead">Tu RUT abre lo que ya guardaste. Puedes seguir después, agregar o quitar, y volver a guardar.</p>

    <form id="survey" novalidate>
      <label class="field">
        <span>RUT</span>
        <input id="rut" name="rut" type="text" inputmode="text" autocomplete="off" required maxlength="12" placeholder="12.345.678-9">
      </label>

      <label class="field">
        <span>Nombre</span>
        <input id="nombre" name="nombre" type="text" required minlength="2" maxlength="120" autocomplete="name" placeholder="Nombre y apellido">
      </label>

      <label class="field">
        <span>Inquietudes, problemáticas y sugerencias</span>
        <small>Registra tus inquietudes, identifica las problemáticas y propone sugerencias de mejora. Puedes hablar de tu cargo, del funcionamiento general y del servicio a quienes usan el tribunal.</small>
        <textarea id="texto" name="texto" required minlength="10" maxlength="8000" rows="10" placeholder="Por ejemplo: en mi cargo falta… El problema que más se repite es… Para atender mejor a los usuarios, sugiero que…"></textarea>
        <em class="count" id="count">0 / 8000</em>
      </label>

      <label class="hp" aria-hidden="true">
        <span>Empresa</span>
        <input type="text" name="empresa" tabindex="-1" autocomplete="off">
      </label>

      <div class="actions">
        <button class="send" id="save" type="submit">Guardar</button>
      </div>
      <p class="state" id="state" hidden role="status">
        <span class="state__mark" aria-hidden="true">✓</span>
        <span>
          <strong id="stateTitle"></strong>
          <span id="stateBody"></span>
        </span>
      </p>
      <p class="note" id="note" hidden></p>
    </form>
  </main>
  <script src="encuesta.js?v=20261126c" defer></script>
</body>
</html>
